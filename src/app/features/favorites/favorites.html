<div class="favorites-container fade-in">
  <header class="favorites-header">
    <h1 class="title-gradient">Mis Favoritos</h1>
    <p class="subtitle">Tu colección personal de cine.</p>
  </header>

  @if (favorites().length > 0) {
    <div class="favorites-grid">
      @for (movie of favorites(); track movie.id) {
        <app-movie-card [movie]="movie" class="slide-up"></app-movie-card>
      }
    </div>
  } @else {
    <div class="empty-state slide-up">
      <div class="empty-icon">🎬</div>
      <h2>Tu lista está vacía</h2>
      <p>Explora películas y marca con el corazón las que quieras guardar aquí.</p>
      <a routerLink="/" class="btn-premium">Explorar Películas</a>
    </div>
  }
</div>
