@if (featuredMovie) {
  <app-hero [movie]="featuredMovie"></app-hero>
  <section class="trending-section">
    <h2 class="section-title">Películas en Tendencia</h2>
    
    <div class="movie-row">
      @for (movie of trendingMovies; track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }
    </div>
  </section>

  <section class="trending-section">
    <h2 class="section-title">Películas Populares</h2>
    
    <div class="movie-row">
      @for (movie of popularMovies; track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }
    </div>
  </section>
} @else {
  <div class="loading-state">
    <p>Cargando películas...</p>
  </div>
}
