@if (featuredMovie()) {
  <app-hero [movie]="featuredMovie()!"></app-hero>
  
  <section class="trending-section slide-up">
    <h2 class="section-title">Películas en Tendencia</h2>
    
    <div class="movie-row">
      @for (movie of trendingMovies(); track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }
    </div>
  </section>

  <section class="trending-section slide-up" style="animation-delay: 0.2s;">
    <h2 class="section-title">Películas Populares</h2>
    
    <div class="movie-grid">
      @for (movie of popularMovies(); track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }
    </div>

    <!-- Ancla del Intersection Observer -->
    <div #scrollAnchor class="scroll-anchor">
      @if (isLoading()) {
        <div class="spinner"></div>
        <p>Cargando más películas...</p>
      }
    </div>
  </section>
} @else {
  <div class="loading-state">
    <p>Cargando películas...</p>
  </div>
}
